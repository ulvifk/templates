[project]
name = "templates"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["gurobipy", "numpy"]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM103"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
project-includes = ["**/*.py*"]
search-path = ["src", "."]

[tool.pyrefly.errors]
unannotated-parameter = true

[tool.pytest.ini_options]
pythonpath = ["src", ".", "scripts"]

[dependency-groups]
dev = ["pyrefly", "pytest", "ruff"]
